<!-- ================= AI CHATBOX WIDGET START ================= -->
<!-- Chat Floating Button -->
<button id="chatToggleBtn" onclick="toggleChatBox()" class="fixed bottom-6 right-6 bg-gradient-to-r from-purple-600 to-pink-600 text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform duration-300 z-50 flex items-center justify-center border-2 border-purple-400/50">
    <i id="chatIcon" class="fas fa-comments text-2xl"></i>
</button>

<!-- Chat Window -->
<div id="chatBox" class="fixed bottom-24 right-6 w-80 sm:w-96 bg-gray-900 border border-purple-500/30 rounded-2xl shadow-2xl z-50 hidden flex-col overflow-hidden transition-all duration-300 font-sans">
    
    <!-- Chat Header -->
    <div class="bg-gradient-to-r from-purple-800 to-pink-700 p-4 flex items-center justify-between border-b border-purple-500/20">
        <div class="flex items-center space-x-3">
            <div class="relative">
                <img src="https://github.com/nazmulhoqueshoab2938-glitch/fs-ai-solutionsfs-ai-solutions-company/blob/main/Gemini_Generated_Image_sor4hlsor4hlsor4.jpg?raw=true" alt="FS AI Assistant" class="w-9 h-9 rounded-full object-cover border border-white/20">
                <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 rounded-full border border-gray-900"></span>
            </div>
            <div>
                <h4 class="text-white font-bold text-sm tracking-wide">FS AI Assistant</h4>
                <p class="text-xs text-purple-200 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span> Online
                </p>
            </div>
        </div>
        <button onclick="toggleChatBox()" class="text-white/80 hover:text-white text-xl focus:outline-none">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Chat Messages Body -->
    <div id="chatBody" class="p-4 h-80 overflow-y-auto space-y-3 bg-gray-900/90 text-xs text-gray-200 flex flex-col">
        <!-- Welcome Message -->
        <div class="flex items-start gap-2 max-w-[85%]">
            <img src="https://github.com/nazmulhoqueshoab2938-glitch/fs-ai-solutionsfs-ai-solutions-company/blob/main/Gemini_Generated_Image_sor4hlsor4hlsor4.jpg?raw=true" class="w-6 h-6 rounded-full mt-1">
            <div class="bg-gray-800 p-3 rounded-2xl rounded-tl-none border border-gray-700">
                Hello! Welcome to <b>FS AI Solutions</b>. How can we help you with your AI Data Annotation project today?
            </div>
        </div>
    </div>

    <!-- Quick Action Suggestions -->
    <div class="p-2 bg-gray-800/60 border-t border-gray-800 flex gap-1.5 overflow-x-auto text-[10px]">
        <button onclick="quickSend('What services do you offer?')" class="bg-purple-900/50 hover:bg-purple-800 text-purple-300 px-2.5 py-1 rounded-full whitespace-nowrap border border-purple-500/30">
            Services?
        </button>
        <button onclick="quickSend('How to contact Nazmul Hoque Shoab?')" class="bg-purple-900/50 hover:bg-purple-800 text-purple-300 px-2.5 py-1 rounded-full whitespace-nowrap border border-purple-500/30">
            Contact
        </button>
        <button onclick="quickSend('Tell me about your QA process.')" class="bg-purple-900/50 hover:bg-purple-800 text-purple-300 px-2.5 py-1 rounded-full whitespace-nowrap border border-purple-500/30">
            QA Process
        </button>
    </div>

    <!-- Chat Input Area -->
    <div class="p-3 bg-gray-800 border-t border-gray-700 flex items-center gap-2">
        <input id="chatInput" type="text" placeholder="Type your message..." onkeypress="handleKeyPress(event)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
        <button onclick="sendMessage()" class="bg-purple-600 hover:bg-purple-700 text-white p-2.5 rounded-xl transition flex items-center justify-center">
            <i class="fas fa-paper-plane text-xs"></i>
        </button>
    </div>
</div>

<!-- Chatbox Script -->
<script>
    function toggleChatBox() {
        const chatBox = document.getElementById('chatBox');
        const chatIcon = document.getElementById('chatIcon');
        
        if (chatBox.classList.contains('hidden')) {
            chatBox.classList.remove('hidden');
            chatBox.classList.add('flex');
            chatIcon.classList.remove('fa-comments');
            chatIcon.classList.add('fa-chevron-down');
        } else {
            chatBox.classList.add('hidden');
            chatBox.classList.remove('flex');
            chatIcon.classList.remove('fa-chevron-down');
            chatIcon.classList.add('fa-comments');
        }
    }

    function quickSend(text) {
        document.getElementById('chatInput').value = text;
        sendMessage();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (text === '') return;

        const chatBody = document.getElementById('chatBody');

        // Add User Message
        const userMsgHTML = `
            <div class="flex items-end justify-end gap-2 max-w-[85%] self-end my-1">
                <div class="bg-purple-600 text-white p-3 rounded-2xl rounded-tr-none">
                    ${escapeHTML(text)}
                </div>
            </div>
        `;
        chatBody.insertAdjacentHTML('beforeend', userMsgHTML);
        input.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;

        // Simulate AI Bot Typing & Response
        setTimeout(() => {
            let botReply = getAutoReply(text);
            const botMsgHTML = `
                <div class="flex items-start gap-2 max-w-[85%] my-1">
                    <img src="https://github.com/nazmulhoqueshoab2938-glitch/fs-ai-solutionsfs-ai-solutions-company/blob/main/Gemini_Generated_Image_sor4hlsor4hlsor4.jpg?raw=true" class="w-6 h-6 rounded-full mt-1">
                    <div class="bg-gray-800 p-3 rounded-2xl rounded-tl-none border border-gray-700">
                        ${botReply}
                    </div>
                </div>
            `;
            chatBody.insertAdjacentHTML('beforeend', botMsgHTML);
            chatBody.scrollTop = chatBody.scrollHeight;
        }, 800);
    }

    function getAutoReply(query) {
        const q = query.toLowerCase();
        if (q.includes('service') || q.includes('offer') || q.includes('work')) {
            return "We provide Image, Video, and Text Data Annotation, 2D/3D Bounding Boxes, Segmentation, and Multi-level QA validation services.";
        } else if (q.includes('contact') || q.includes('shoab') || q.includes('phone') || q.includes('call')) {
            return "You can directly contact Founder & Owner Nazmul Hoque Shoab at <b>01521567789</b> or check his <a href='https://www.linkedin.com/in/nazmul-hoque-shoab-473a23228/' target='_blank' class='text-purple-400 underline'>LinkedIn</a>.";
        } else if (q.includes('qa') || q.includes('quality') || q.includes('review')) {
            return "We follow a multi-tier Quality Assurance process including self-checks, peer reviews, and human-in-the-loop final verification.";
        } else {
            return "Thank you for reaching out! Please leave your details or call us directly at <b>01521567789</b> to discuss your project.";
        }
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }
</script>
<!-- ================= AI CHATBOX WIDGET END ================= -->
